<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprout Viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body.backdrop-checker {
        background-color: #1b1b1f;
        background-image:
          linear-gradient(45deg, #26262c 25%, transparent 25%), linear-gradient(-45deg, #26262c 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #26262c 75%), linear-gradient(-45deg, transparent 75%, #26262c 75%);
        background-size: 32px 32px;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      }
      body.backdrop-black { background: #000; }
      #gl, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { pointer-events: none; }
      #scope { position: fixed; left: 8px; bottom: 8px; inset: auto auto 8px 8px; display: none; border-radius: 6px; cursor: pointer; }
      #panel { position: fixed; top: 8px; right: 8px; width: 300px; max-height: calc(100vh - 16px); overflow-y: auto; }
      /* /controls: the panel and the voice scope only, nothing drawn. */
      html.controls body { background: #15161a; }
      html.controls #gl, html.controls #overlay { display: none; }
      html.controls #panel { width: 420px; }
      #theme-panel { position: fixed; top: 8px; left: 8px; width: 300px; max-height: calc(100vh - 16px); overflow-y: auto; }
      .sprout-toolbar { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 4px 6px; }
      .sprout-toolbar button { flex: 1 1 auto; font: 11px system-ui, sans-serif; color: #e6e9ee; background: #3a3d46;
        border: 1px solid #4a4e59; border-radius: 3px; padding: 3px 6px; cursor: pointer; white-space: nowrap; }
      .sprout-toolbar button:hover { background: #4a4e59; }
      #error { position: fixed; left: 8px; bottom: 8px; right: 320px; color: #ff8080; font: 12px/1.4 monospace;
               white-space: pre-wrap; background: #000c; padding: 8px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <canvas id="scope"></canvas>
    <div id="panel"></div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
