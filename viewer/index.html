<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sprouting Halo</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
      body.backdrop-checker {
        background-color: #1b1b1f;
        background-image:
          linear-gradient(45deg, #26262c 25%, transparent 25%), linear-gradient(-45deg, #26262c 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #26262c 75%), linear-gradient(-45deg, transparent 75%, #26262c 75%);
        background-size: 32px 32px;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      }
      body.backdrop-checker-light, body.backdrop-checker-split {
        background-color: #ececf0;
        background-image:
          linear-gradient(45deg, #d6d6de 25%, transparent 25%), linear-gradient(-45deg, #d6d6de 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #d6d6de 75%), linear-gradient(-45deg, transparent 75%, #d6d6de 75%);
        background-size: 32px 32px;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      }
      /* Split: the dark checker over the left half (the canopy is symmetric: one look, both backgrounds). */
      body.backdrop-checker-split::before {
        content: ''; position: fixed; inset: 0 50% 0 0;
        background-color: #1b1b1f;
        background-image:
          linear-gradient(45deg, #26262c 25%, transparent 25%), linear-gradient(-45deg, #26262c 25%, transparent 25%),
          linear-gradient(45deg, transparent 75%, #26262c 75%), linear-gradient(-45deg, transparent 75%, #26262c 75%);
        background-size: 32px 32px;
        background-position: 0 0, 0 16px, 16px -16px, -16px 0;
      }
      body.backdrop-black { background: #000; }
      body.backdrop-white { background: #fff; }
      /* Native dropdown lists: dark like the panel (they were white on white in places). */
      select { color-scheme: dark; }
      select option { color: #e6e9ee; background: #26282c; }
      #gl, #overlay { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #overlay { pointer-events: none; }
      #scope { position: fixed; left: 8px; bottom: 8px; inset: auto auto 8px 8px; display: none; border-radius: 6px; cursor: pointer; }
      /* The settings panel: a fixed head over a scrolling body (built in ui.ts, which also holds the
         styles of its parts). */
      #panel { position: fixed; top: 8px; right: 8px; width: 340px; max-height: calc(100vh - 16px); display: flex;
        flex-direction: column; overflow: hidden; border-radius: 9px; background: #1c1e24;
        border: 1px solid rgba(255,255,255,0.07); box-shadow: 0 6px 24px rgba(0,0,0,0.5); box-sizing: border-box; }
      /* The scrollbar's room is always kept, so nothing moves when a panel gets long enough to scroll;
         a thin dark one, so the kept room is a narrow strip. */
      #theme-panel { scrollbar-gutter: stable; scrollbar-width: thin; scrollbar-color: #4a4e58 transparent; }
      /* One skin for both panels (Tweakpane's theme variables): dark buttons, a plain readable font. */
      #panel, #theme-panel {
        --tp-base-background-color: #1c1e24; --tp-base-shadow-color: rgba(0,0,0,0.45);
        --tp-base-font-family: system-ui, 'Segoe UI', Roboto, sans-serif;
        --tp-base-border-radius: 7px; --tp-blade-border-radius: 4px; --tp-blade-value-width: 160px;
        --tp-container-unit-size: 22px;
        --tp-button-background-color: #363a45; --tp-button-background-color-hover: #424756;
        --tp-button-background-color-focus: #4a5061; --tp-button-background-color-active: #535a6c;
        --tp-button-foreground-color: #e6e9ee;
        --tp-container-background-color: rgba(255,255,255,0.05); --tp-container-background-color-hover: rgba(255,255,255,0.08);
        --tp-container-background-color-focus: rgba(255,255,255,0.1); --tp-container-background-color-active: rgba(255,255,255,0.13);
        --tp-container-foreground-color: #d9dde5;
        --tp-input-background-color: rgba(255,255,255,0.07); --tp-input-background-color-hover: rgba(255,255,255,0.1);
        --tp-input-background-color-focus: rgba(255,255,255,0.13); --tp-input-background-color-active: rgba(255,255,255,0.16);
        --tp-input-foreground-color: #e6e9ee; --tp-label-foreground-color: #a8aeba;
        --tp-groove-foreground-color: rgba(255,255,255,0.13);
      }
      #panel .tp-rotv, #theme-panel .tp-rotv { font-size: 12px; font-weight: 400; }
      #theme-panel { --tp-blade-value-width: 150px; }
      /* Slider knobs light enough to find on the dark groove. */
      #panel .tp-sldv_k::after, #theme-panel .tp-sldv_k::after { background-color: #aeb6c6; }
      #panel .tp-sldv_t:hover .tp-sldv_k::after, #theme-panel .tp-sldv_t:hover .tp-sldv_k::after { background-color: #e1e6f0; }
      /* /controls: the panel and the voice scope only, nothing drawn. */
      html.controls body { background: #15161a; }
      html.controls #gl, html.controls #overlay { display: none; }
      html.controls #panel { width: 420px; --tp-blade-value-width: 197px; }
      #theme-panel { position: fixed; top: 8px; left: 8px; width: 300px; max-height: calc(100vh - 16px); overflow-y: auto; }
      #error { position: fixed; left: 8px; bottom: 8px; right: 360px; color: #ff8080; font: 12px/1.4 monospace;
               white-space: pre-wrap; background: #000c; padding: 8px; display: none; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <canvas id="overlay"></canvas>
    <canvas id="scope"></canvas>
    <div id="panel"></div>
    <div id="error"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
